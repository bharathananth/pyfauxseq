[project]
name = "pyfauxseq"
version = "0.1.0"
description = "This package generates synthetic rhythmic timeseries RNAseq datasets."
readme = "README.md"
authors = [
  {name = "Bharath Ananthasubramaniam", email = "bharath.ananthasubramaniam@hu-berlin.de"}
]
maintainers = [
  {name = "Bharath Ananthasubramaniam", email = "bharath.ananthasubramaniam@hu-berlin.de"}
]
classifiers = [
    # TODO
]
license = "MIT"
dependencies = [
  "numpy",
  "scipy",
  "pandas"
, "mkdocs-execute-plugin>=0.0.9,<0.0.10"]
requires-python = ">= 3.10"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyfauxseq = ["data/*.csv.gz"]

[project.optional-dependencies]
test = [
    "coverage",  # testing
    "pytest",  # testing
    "ruff",  # linting
    "ty", # checking types
    "ipdb", # debugging
]

[project.urls]
bugs = "https://github.com/bharathananth/pyfauxseq/issues"
changelog = "https://github.com/bharathananth/pyfauxseq/blob/master/changelog.md"
homepage = "https://github.com/bharathananth/pyfauxseq"


[tool.ty]
# All rules are enabled as "error" by default; no need to specify unless overriding.
# Example override: relax a rule for the entire project (uncomment if needed).
# rules.TY015 = "warn"  # For invalid-argument-type, warn instead of error.

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "D",   # pydocstyle (enforces docstring conventions like PEP 257)
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]

[tool.ruff.lint.pydocstyle]
convention = "numpy" # Options: "google", "numpy", or "pep257"

[tool.uv]
package = true

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "win-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
pyfauxseq = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }

[tool.pixi.tasks]

[tool.pixi.feature.test.dependencies]
ruff = ">=0.15.5,<0.16"
ty = ">=0.0.21,<0.0.22"
ipykernel = ">=7.2.0,<8"
pandas-stubs = ">=3.0.0.260204,<4"

[tool.pixi.dependencies]
mkdocs-material = ">=9.7.5,<10"
mkdocstrings-python = ">=2.0.2,<3"
mkdocs = "<2.0.0"
