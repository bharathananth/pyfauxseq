[project]
name = "pyfauxseq"
version = "0.1.0"
description = "This package generates synthetic time-series RNA-seq data containing a user-specified fraction of rhythmic genes, while preserving the empirical relationship between mean gene expression and variability observed across biological replicates. It is the Python counterpart to fauxseq, an R package providing the same functionality."
readme = {"file" = "README.md", "content-type" = "text/markdown"}
requires-python = ">= 3.10"
license = "MIT"
authors = [
  {name = "Bharath Ananthasubramaniam", email = "bharath.ananthasubramaniam@hu-berlin.de"}
]
maintainers = [
  {name = "Bharath Ananthasubramaniam", email = "bharath.ananthasubramaniam@hu-berlin.de"}
]
keywords = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Healthcare Industry",
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License"
]
dependencies = [
  "numpy",
  "scipy",
  "pandas"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
test = [
    "coverage",  # testing
    "pytest",  # testing
    "ruff",  # linting
    "ty", # checking types
    "hypothesis", # for CBT
]
docs = [
  "mkdocs",
  "mkdocs-material",
  "mkdocstrings-python"
]

[project.urls]
bugs = "https://github.com/bharathananth/pyfauxseq/issues"
homepage = "https://github.com/bharathananth/pyfauxseq"
documentation = "https://bharathananth.github.io/pyfauxseq"

[tool.hatch.build.targets.sdist]
# Hatchling includes README, LICENSE, and pyproject.toml by default.
include = [
  "/CONTRIBUTING.md",
  "/HISTORY.md",
  "/docs",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyfauxseq"]

[tool.hatch.envs.default]
installer = "uv"

[tool.ty]
# All rules are enabled as "error" by default; no need to specify unless overriding.
# Example override: relax a rule for the entire project (uncomment if needed).
# rules.TY015 = "warn"  # For invalid-argument-type, warn instead of error.

[tool.ty.src]
exclude = ["tests"]

[tool.ruff]
line-length = 88
extend-exclude = ["tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "D",   # pydocstyle (enforces docstring conventions like PEP 257)
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]

[tool.ruff.lint.pydocstyle]
convention = "numpy" # Options: "google", "numpy", or "pep257"

[tool.uv]
package = true

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "win-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
pyfauxseq = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
dev = ["docs", "lint", "test", "usage"]

[tool.pixi.tasks]
test = { cmd = "pytest", default-environment = "test" }

[tool.pixi.feature.test.dependencies]
pytest = ">=9.0.2,<10"
hypothesis = ">=6.151.9,<7"
ipython = ">=9.11.0,<10"

[tool.pixi.feature.docs.dependencies]
mkdocs = "<2.0.0"
mkdocs-material = "*"
mkdocstrings-python = "*"

[tool.pixi.feature.lint.dependencies]
ruff = "*"
ty = "*"
pandas-stubs = "*"
validate-pyproject = ">=0.25,<0.26"

[tool.pixi.feature.usage.dependencies]
matplotlib = "*"
numpy = "*"
scipy = "*"
ipython = ">=9.16.1,<10"
jupyter = ">=1.1.1,<2"
notebook = ">=7.6.2,<8"
ipykernel = ">=7.3.0,<8"
anndata = ">=0.13.2,<0.14"
nbstripout = ">=0.9.1,<0.10"

[dependency-groups]
usage = ["pydeseq2"]
